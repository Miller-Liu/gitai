[project]
name = "git-ai"
version = "0.1.0"
authors = [
    { name="Miller Liu", email="millerliu@berkeley.edu" },
]
description = "AI-powered git CLI assistant"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12",
    "ollama>=0.2",
    "rich>=13.0",
    "tomli-w>=1.0",

    "langgraph>=1.0,<2.0",
    "langchain>=1.0,<2.0",
    "langchain-groq>1.0,<2.0",
    "langchain-core>=0.3",
    "langchain-google-genai>4.0,<5.0",

    "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
]

[project.scripts]
git-ai = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]